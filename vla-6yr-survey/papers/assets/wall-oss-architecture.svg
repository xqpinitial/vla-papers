<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">WALL-OSS：把 VLM 接到可执行动作空间</text>

  <!-- inputs -->
  <rect x="24" y="84" width="180" height="70" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="114" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">图像 + 语言指令</text>
  <text x="114" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">任务 / 场景</text>

  <!-- backbone -->
  <rect x="240" y="84" width="190" height="70" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="335" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">VLM backbone</text>
  <text x="335" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">3B VLM 初始化</text>

  <!-- reasoning -->
  <rect x="466" y="84" width="180" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="556" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Embodied reasoning</text>
  <text x="556" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">Uni-CoT / 子任务</text>

  <!-- moe heads -->
  <rect x="692" y="84" width="184" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="784" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">MoE action heads</text>
  <text x="784" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">按阶段激活专家</text>

  <line x1="204" y1="119" x2="240" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="119" x2="466" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646" y1="119" x2="692" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="784" y1="154" x2="784" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="692" y="238" width="184" height="88" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="784" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">动作输出</text>
  <text x="784" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">离散 token 或</text>
  <text x="784" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">flow matching 连续</text>

  <text x="24" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">两阶段训练：Inspiration 注入离散动作先验 →</text>
  <text x="24" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Integration 用 flow matching 做连续控制。</text>
  <text x="24" y="318" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">数据：自采动作 + 开源动作 + multimodal VQA 混训（章节转述）。</text>
  <text x="24" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 WALL-OSS 导读；不是论文原图。</text>
</svg>
