<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">PRTS：把目标可达性对比 RL 放进 VLA 预训练</text>

  <!-- inputs -->
  <rect x="24" y="96" width="196" height="116" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="122" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">输入 token 流</text>
  <text x="122" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">egocentric + wrist 图像</text>
  <text x="122" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">文本机器人状态 / 指令</text>
  <text x="122" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">动作 token</text>

  <line x1="220" y1="154" x2="256" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- backbone -->
  <rect x="258" y="96" width="184" height="116" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="350" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">Qwen3-VL</text>
  <text x="350" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">backbone</text>
  <text x="350" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">single-forward</text>
  <text x="350" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">attention mask</text>

  <line x1="442" y1="130" x2="490" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="168" x2="490" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="442" y1="190" x2="490" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- action expert -->
  <rect x="492" y="56" width="200" height="84" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="592" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Flow Matching</text>
  <text x="592" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Action Expert (DiT)</text>
  <text x="592" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">noised → denoised 动作</text>

  <line x1="692" y1="98" x2="720" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">连续动作 chunk</text>

  <!-- phi -->
  <rect x="492" y="164" width="200" height="56" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="592" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">State-Action Encoder</text>
  <text x="592" y="207" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">φ(s, a)</text>

  <!-- psi -->
  <rect x="492" y="238" width="200" height="56" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="592" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">Goal Encoder ψ(g)</text>
  <text x="592" y="281" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">语言目标 g</text>

  <line x1="692" y1="192" x2="722" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="266" x2="722" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CRL -->
  <rect x="724" y="164" width="152" height="130" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="800" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">内积 ≈ log Q(s,a,g)</text>
  <text x="800" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">CRL loss</text>
  <text x="800" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">reward-label-free</text>
  <text x="800" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">同一次 forward</text>
  <text x="800" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">接近 BC compute</text>

  <text x="24" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">输入：egocentric + wrist 视角、文本机器人状态、指令 goal、动作 token；mask 控制可见性。</text>
  <text x="24" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">CRL：用轨迹时序构造正负样本并做几何时间加权；不需要人工 reward label。</text>
  <text x="24" y="414" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 PRTS 导读；不是论文原图。</text>
</svg>
