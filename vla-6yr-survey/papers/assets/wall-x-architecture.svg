<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">WALL-X：checkpoint → 训练 → 服务的工程链路</text>

  <!-- checkpoint -->
  <rect x="24" y="80" width="190" height="66" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="119" y="106" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">HF checkpoint</text>
  <text x="119" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">wall-oss-0.5 / flow / fast</text>

  <!-- data -->
  <rect x="24" y="196" width="190" height="66" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="119" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">LeRobot 数据集</text>
  <text x="119" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">LIBERO 或自有数据</text>

  <!-- config -->
  <rect x="262" y="138" width="200" height="86" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="362" y="166" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">workspace/*.yml</text>
  <text x="362" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">模型 / processor / 动作维度</text>
  <text x="362" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">数据路径 / 超参</text>

  <!-- training -->
  <rect x="510" y="80" width="190" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="605" y="108" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">training script</text>
  <text x="605" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">后训练 fine-tune</text>

  <!-- server -->
  <rect x="510" y="205" width="190" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="605" y="233" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">policy server</text>
  <text x="605" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">推理服务</text>

  <!-- eval -->
  <rect x="726" y="205" width="150" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="801" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">LIBERO 评估</text>
  <text x="801" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">或机器人部署</text>

  <line x1="214" y1="113" x2="262" y2="169" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="214" y1="229" x2="262" y2="193" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="181" x2="510" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="150" x2="605" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="240" x2="726" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="24" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">WALL-X 不是单独论文，是 WALL 系列的开源工程栈（章节判断）。</text>
  <text x="24" y="344" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">workspace README 面向 wall-oss-0.5；flow/FAST 需切历史 commit。</text>
  <text x="24" y="368" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">固定 LeRobot commit c66cd401；Python 3.10；安装时编译 CUDA op。</text>
  <text x="24" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 WALL-X 导读；不是论文原图。</text>
</svg>
