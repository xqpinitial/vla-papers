<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Dexora：36-DoF 双臂双手与质量感知训练</text>

  <!-- input -->
  <rect x="24" y="80" width="190" height="70" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="119" y="108" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">四路 RGB + 36-DoF 状态</text>
  <text x="119" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">语言指令 / 任务上下文</text>

  <!-- teleop -->
  <rect x="238" y="80" width="190" height="70" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="333" y="106" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">混合遥操作</text>
  <text x="333" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">外骨骼双臂 · Vision Pro 手指</text>
  <text x="333" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">端到端约 11 ms</text>

  <!-- data -->
  <rect x="452" y="80" width="190" height="70" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="547" y="106" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">数据池</text>
  <text x="547" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">仿真 100K 轨迹 / 361h</text>
  <text x="547" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">真机 10K+ episodes / 40.5h</text>

  <!-- filter -->
  <rect x="666" y="80" width="184" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="758" y="106" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">data filtering</text>
  <text x="758" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">acceleration / jerk</text>
  <text x="758" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">replay / post-validation</text>

  <line x1="214" y1="115" x2="238" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="428" y1="115" x2="452" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="642" y1="115" x2="666" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- discriminator -->
  <path d="M 758 150 L 758 250 L 652 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="452" y="210" width="200" height="80" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="552" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">discriminator</text>
  <text x="552" y="259" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">冻结的 diffusion transformer</text>
  <text x="552" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">输出 quality d(C) ∈ (0, 1]</text>

  <!-- weighted training -->
  <line x1="452" y1="250" x2="430" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="210" width="230" height="80" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="315" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">质量加权 post-training</text>
  <text x="315" y="259" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">高质量 clip 权重大</text>
  <text x="315" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">低质量 clip 权重小</text>

  <!-- output -->
  <line x1="315" y1="290" x2="315" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="352" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">36-DoF 双臂双手连续动作</text>
  <text x="315" y="371" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">推理时只用 policy，discriminator 不参与</text>

  <text x="24" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">仿真与真实数据共用双臂双手 embodiment；过滤 + 质量分 + 加权 diffusion loss。</text>
  <text x="24" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 Dexora 导读；不是论文原图。</text>
</svg>
