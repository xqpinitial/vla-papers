<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">SmolVLA × LIBERO：单卡微调与 7 维动作闭环</text>

  <!-- observation -->
  <rect x="24" y="70" width="210" height="100" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="129" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">LIBERO 观测</text>
  <text x="129" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">agentview + wrist 256×256</text>
  <text x="129" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">state 拼接 + task 文本</text>

  <!-- policy -->
  <rect x="270" y="70" width="200" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="370" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">SmolVLAPolicy</text>
  <text x="370" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">smolvla_base</text>
  <text x="370" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">load_vlm_weights=True</text>

  <!-- action -->
  <rect x="510" y="70" width="180" height="100" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">select_action</text>
  <text x="600" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">7 维动作</text>
  <text x="600" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">inference_mode</text>

  <!-- gripper postprocess -->
  <rect x="510" y="220" width="180" height="100" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="600" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">夹爪后处理</text>
  <text x="600" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">[0,1] → [-1,1]</text>
  <text x="600" y="291" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">再翻转符号</text>

  <!-- env step -->
  <rect x="270" y="220" width="200" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="370" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">LIBERO env.step</text>
  <text x="370" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">每 suite 220–520 步</text>
  <text x="370" y="291" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">done → 成功</text>

  <!-- log -->
  <rect x="270" y="365" width="200" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="370" y="394" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">日志 / 视频 / 成功率</text>

  <!-- arrows -->
  <line x1="234" y1="120" x2="266" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="120" x2="506" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="170" x2="600" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="270" x2="474" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 270 250 L 140 250 L 140 174" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="320" x2="370" y2="361" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="710" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">state = eef_pos 3 +</text>
  <text x="710" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">axisangle 3 + gripper_qpos 2</text>
  <text x="710" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">图像先旋转 180°，</text>
  <text x="710" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">再 /255、CHW、加 batch</text>
  <text x="710" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">每 episode 调 policy.reset()</text>
  <text x="710" y="328" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">章节未给 backbone /</text>
  <text x="710" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">参数量 / action chunk</text>

  <text x="24" y="422" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">自绘，依据本地 SmolVLA 导读；不是论文原图。</text>
</svg>
