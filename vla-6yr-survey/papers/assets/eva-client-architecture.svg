<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">EVA-Client：策略服务到真机执行的部署链路</text>

  <!-- robot -->
  <rect x="24" y="76" width="178" height="100" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="113" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">机器人 + 相机</text>
  <text x="113" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">关节状态 / RGB</text>
  <text x="113" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">任务文本 / 控制台</text>

  <!-- transport -->
  <rect x="238" y="76" width="178" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="327" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Transport 传输层</text>
  <text x="327" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">ROS1 / ROS2</text>
  <text x="327" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">ZMQ / LeRobot 数据集</text>

  <!-- policy client -->
  <rect x="452" y="76" width="200" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="552" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Policy Client</text>
  <text x="552" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">统一观测 → 推理请求</text>
  <text x="552" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">响应 → action chunk</text>

  <!-- policy server -->
  <rect x="688" y="76" width="188" height="100" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="782" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">外部策略服务器</text>
  <text x="782" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">openpi / openpi_rtc</text>
  <text x="782" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">starvla / gr00t</text>
  <text x="782" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">mock / replay</text>

  <line x1="202" y1="126" x2="238" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="416" y1="126" x2="452" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="652" y1="118" x2="688" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="138" x2="652" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- inference strategy -->
  <rect x="452" y="246" width="200" height="88" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="552" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Inference Strategy</text>
  <text x="552" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">sync / async / naive</text>
  <text x="552" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">act / rtc</text>

  <!-- action conversion -->
  <rect x="238" y="246" width="178" height="88" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="327" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">动作空间转换 / IK</text>
  <text x="327" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">JointState / EEFPose</text>
  <text x="327" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">PyRoki 逆运动学</text>

  <line x1="552" y1="176" x2="552" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">action chunk</text>

  <line x1="452" y1="290" x2="416" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 238 290 H 120 V 176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="126" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">下发动作</text>
  <text x="126" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">限位 / 急停</text>

  <text x="24" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Recorder / Evaluator 旁路记录观测、模型预测、下发动作与评测元信息，按 absolute_step 对齐。</text>
  <text x="24" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">策略服务可分机部署：控制机只跑客户端，推理放到 GPU 服务器，经局域网或端口转发连接。</text>
  <text x="24" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 EVA-Client 导读；不是论文原图。</text>
</svg>
