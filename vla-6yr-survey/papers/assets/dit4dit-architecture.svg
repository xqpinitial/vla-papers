<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">DiT4DiT：Cosmos 视频 backbone + DiT 动作头</text>

  <!-- data -->
  <rect x="20" y="150" width="140" height="120" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="90" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">LIBERO 数据</text>
  <text x="90" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">432 episode</text>
  <text x="90" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">5.3 万帧 / 362 MB</text>
  <text x="90" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">modality.json</text>

  <!-- cosmos -->
  <rect x="185" y="105" width="165" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="267" y="131" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Cosmos-Predict2.5-2B</text>
  <text x="267" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">视频 / 视觉语言</text>
  <text x="267" y="177" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">smoke 中冻结</text>

  <!-- dit head -->
  <rect x="185" y="245" width="165" height="100" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="267" y="271" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">DiT 动作头</text>
  <text x="267" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">action model 163.07M</text>
  <text x="267" y="317" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">占 10.64B 的 1.53%</text>

  <!-- policy server -->
  <rect x="385" y="150" width="145" height="120" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="457" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">policy server</text>
  <text x="457" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">加载 checkpoint</text>
  <text x="457" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">websockets</text>

  <!-- libero client -->
  <rect x="560" y="150" width="145" height="120" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="632" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">LIBERO client</text>
  <text x="632" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">MuJoCo / robosuite</text>
  <text x="632" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">EGL 离屏渲染</text>

  <!-- output -->
  <rect x="735" y="150" width="145" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="807" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">评估输出</text>
  <text x="807" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">Total success rate</text>
  <text x="807" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">10 任务 × 1 trial</text>

  <!-- arrows -->
  <line x1="160" y1="190" x2="185" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="230" x2="185" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="267" y1="205" x2="267" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="150" x2="385" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="295" x2="385" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="210" x2="560" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="210" x2="735" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="632,270 632,365 457,365 457,270" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="475" y="359" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">动作 → 执行 → 下一帧观测</text>

  <text x="24" y="396" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">关键数字：10.64B 总参数 / 163.07M 可训练（1.53%）；432 episode；10 任务 ×1 trial smoke 10/10。</text>
  <text x="24" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 DiT4DiT 导读；不是论文原图。</text>
</svg>
