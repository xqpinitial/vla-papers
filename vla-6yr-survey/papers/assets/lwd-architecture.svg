<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">LWD：部署数据回流成机群 RL 飞轮</text>

  <!-- offline buffer -->
  <rect x="24" y="80" width="190" height="78" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="119" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">离线 buffer 652.5h</text>
  <text x="119" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">示教 336.6h / 成功 88.8h</text>
  <text x="119" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">失败 39.2h / play 187.9h</text>

  <!-- pretrain -->
  <rect x="238" y="80" width="190" height="78" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="333" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">离线 RL 预训练</text>
  <text x="333" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">VLA + flow action head</text>
  <text x="333" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">DIVL critic + QAM 提取</text>

  <!-- fleet -->
  <rect x="452" y="80" width="190" height="78" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="547" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">机群部署</text>
  <text x="547" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">16 台 AgiBot G1</text>
  <text x="547" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">8 个真实任务 / 3–5 分钟</text>

  <!-- online buffer -->
  <rect x="666" y="80" width="184" height="78" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="758" y="107" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">online buffer</text>
  <text x="758" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">成功 / 失败 / 恢复</text>
  <text x="758" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">人类接管 / play</text>

  <line x1="214" y1="119" x2="238" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="428" y1="119" x2="452" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="642" y1="119" x2="666" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DIVL -->
  <path d="M 758 158 L 758 250 L 652 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="452" y="210" width="200" height="80" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="552" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">DIVL critic / value</text>
  <text x="552" y="259" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">回报分布而非标量</text>
  <text x="552" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">quantile TD target</text>

  <!-- QAM -->
  <line x1="452" y1="250" x2="430" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="210" width="230" height="80" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="315" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">QAM policy extraction</text>
  <text x="315" y="259" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">critic 梯度 → flow 局部目标</text>
  <text x="315" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">不穿过完整生成过程反传</text>

  <!-- redeploy loop -->
  <path d="M 315 210 L 315 180 L 547 180 L 547 158" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">更新后的共享策略重新部署</text>

  <text x="24" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">两阶段：离线 buffer 上做 RL 预训练 → 离线 + 在线混合 replay 持续后训练。</text>
  <text x="24" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">QAM = Q-learning with Adjoint Matching，不是 Query Attention Module。</text>
  <text x="24" y="376" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">16 台机器人是部署机群，不是训练卡数；代码与权重章节未给。</text>
  <text x="24" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 LWD 导读；不是论文原图。</text>
</svg>
