<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">ACT：CVAE + 动作分块 Transformer</text>

  <!-- inputs -->
  <rect x="24" y="70" width="170" height="180" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="109" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">输入 / 标签</text>
  <text x="109" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">图像 3×256×256</text>
  <text x="109" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">状态 6 维</text>
  <text x="109" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">动作 10×7</text>
  <text x="109" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">action_is_pad</text>
  <text x="109" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">task（ACT 不用）</text>

  <!-- vision -->
  <rect x="220" y="70" width="160" height="86" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="300" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">ResNet18</text>
  <text x="300" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">layer4 (B,512,8,8)</text>
  <text x="300" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">1×1 Conv → 64 token</text>

  <!-- vae -->
  <rect x="220" y="176" width="160" height="74" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="300" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">VAE Encoder ×4</text>
  <text x="300" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">12 token → μ/log σ²</text>
  <text x="300" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">z(32)，仅训练态</text>

  <!-- transformer -->
  <rect x="410" y="70" width="190" height="180" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="505" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">ACT Transformer</text>
  <text x="505" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">encoder ×4</text>
  <text x="505" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">66 token = 1 latent</text>
  <text x="505" y="164" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">+ 1 state + 64 视觉</text>
  <text x="505" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">decoder ×1</text>
  <text x="505" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">10 个 query</text>
  <text x="505" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">512 维 / 8 头 / FFN 3200</text>

  <!-- head -->
  <rect x="630" y="70" width="150" height="86" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="705" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">动作头</text>
  <text x="705" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">Linear 512→7</text>
  <text x="705" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">(B,10,7) 反归一化</text>

  <!-- loss -->
  <rect x="630" y="176" width="150" height="74" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="705" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">损失 / 执行</text>
  <text x="705" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">L1×¬pad + 10·KL</text>
  <text x="705" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">队列 maxlen=10</text>

  <!-- arrows -->
  <line x1="194" y1="110" x2="220" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="194" y1="205" x2="220" y2="213" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="110" x2="410" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="213" x2="410" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="110" x2="630" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="156" x2="705" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="109,250 109,292 705,292 705,250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="220" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">动作标签与 mask 直接进入 L1，不经过主干</text>

  <text x="24" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">关键数字：51,552,181 总参数；推理约 34.19M；encoder 66 token；decoder 10 query。</text>
  <text x="24" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">训练态：VAE encoder 4 层，cls + state + 10 action；推理态 latent 置零，跳过 VAE。</text>
  <text x="24" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">位置编码：latent/state 用 Embedding(2,512)，视觉用 2D 正弦；dropout 0.1。</text>
  <text x="24" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 ACT 导读；不是论文原图。</text>
</svg>
