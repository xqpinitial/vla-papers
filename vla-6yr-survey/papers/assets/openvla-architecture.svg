<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">OpenVLA：视觉语言到 7 维连续动作</text>

  <!-- top row -->
  <rect x="24" y="78" width="160" height="70" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="104" y="105" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">多视角 RGB</text>
  <text x="104" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">+ 任务指令</text>

  <line x1="184" y1="113" x2="222" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="224" y="78" width="176" height="70" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="312" y="105" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">SigLIP / DINOv2</text>
  <text x="312" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">可双编码器</text>

  <line x1="400" y1="113" x2="438" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="78" width="170" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="525" y="105" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">MLP projector</text>
  <text x="525" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">vision_dim → 4× → llm_dim</text>

  <line x1="610" y1="113" x2="648" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="72" width="250" height="82" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="775" y="101" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">LLaMA-2 / Vicuna / Mistral</text>
  <text x="775" y="123" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">BF16 + Flash Attention 2</text>

  <!-- text token path -->
  <rect x="24" y="210" width="160" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="104" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">指令 tokenizer</text>
  <text x="104" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">text_embeds</text>
  <line x1="184" y1="239" x2="648" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- action path -->
  <line x1="775" y1="154" x2="775" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="212" width="250" height="70" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="775" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">7 维连续动作头</text>
  <text x="775" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">[x, y, z, rx, ry, rz, gripper]</text>

  <line x1="650" y1="247" x2="602" y2="247" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="212" width="180" height="70" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="510" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">反归一化</text>
  <text x="510" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">a = a_norm × σ + μ</text>

  <line x1="420" y1="247" x2="352" y2="247" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="212" width="130" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="285" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">LIBERO</text>
  <text x="285" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">/ 机器人</text>

  <text x="24" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">视觉 patch 形状：[batch, num_patches, vision_dim]；projector 输出投影到 llm_dim。</text>
  <text x="24" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">动作训练用 Z-score 归一化，推理按数据集统计量反归一化（unnorm_key = task_suite_name）。</text>
  <text x="24" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 OpenVLA 导读；不是论文原图。</text>
</svg>
