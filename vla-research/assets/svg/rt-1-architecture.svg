<text x="40" y="1058" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#5F6B7A" text-anchor="start">本地笔记中的「动作维度 章节未给」是导读口径；论文原文明确为 7+3+1 = 11 维，两者分列，不互相覆盖。</text>
