<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">PhysBrain 1.0：物理常识预训练 + 双脑 VLA 适配</text>

  <!-- human video -->
  <rect x="24" y="88" width="180" height="78" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="114" y="113" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">人类第一人称视频</text>
  <text x="114" y="135" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">Ego4D / BuildAI / EgoDex</text>
  <text x="114" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">EPIC / SEA-Small</text>

  <line x1="204" y1="127" x2="230" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- structured meta -->
  <rect x="234" y="88" width="200" height="78" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="334" y="113" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">结构化物理元信息</text>
  <text x="334" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1f2937">scene_elements / spatial_dynamics</text>
  <text x="334" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">action_execution / depth_info</text>

  <line x1="434" y1="127" x2="460" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- depth + QA -->
  <rect x="464" y="88" width="180" height="78" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="554" y="113" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">深度增强 + 物理 QA</text>
  <text x="554" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">Depth Anything v3</text>
  <text x="554" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">4 类 QA family</text>

  <line x1="644" y1="127" x2="670" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VLM -->
  <rect x="674" y="88" width="202" height="78" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="775" y="113" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">PhysBrain VLM</text>
  <text x="775" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">物理常识预训练</text>
  <text x="775" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">混入通用多模态数据</text>

  <line x1="775" y1="166" x2="775" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- twin brain -->
  <rect x="604" y="216" width="272" height="96" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="740" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">TwinBrainVLA + LangForce</text>
  <text x="740" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">冻结左脑 + 可训练右脑</text>
  <text x="740" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">log p(L|V,A) − sg log p(L|V)</text>

  <line x1="604" y1="264" x2="532" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- robot actions -->
  <rect x="284" y="216" width="248" height="96" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="408" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">机器人动作</text>
  <text x="408" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">SimplerEnv / LIBERO</text>
  <text x="408" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">RoboCasa-GR1 / 真机 Franka</text>

  <text x="24" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">数据侧：人类视频先做质量过滤，再解析成 4 类字段，补深度后渲染成物理 QA。</text>
  <text x="24" y="386" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">适配侧：左脑冻结保留通用能力，右脑学动作；LangForce 用语言似然比抑制视觉捷径。</text>
  <text x="24" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 PhysBrain 导读；不是论文原图。</text>
</svg>
