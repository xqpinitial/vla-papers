<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">WALL-OSS 重新分配的是“动作生成放在 VLM 的什么位置”——不是给 VLM 外接一个线性 action head，而是把 embodied reasoning、子任务</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">分解和细粒度动作合成放进同一条紧耦合链路，再用两阶段训练把离散动作先验接到连续控制上。【章节】</text>
