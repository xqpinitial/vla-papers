<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">把 VLM 的高层决策与运动执行解耦的评测框架：冻结现成 VLM 每 0.5s 发原子全身技能指令，DiT 运动基座 + 每技能 ControlNet 落地成连续</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">动作，Half-Physics 仿真保留重力/碰撞但排除失衡/电机误差——9 个前沿 VLM 最好成绩仅 16.8%</text>
