<text x="876" y="32" font-size="11" fill="#ffffff" font-weight="400" text-anchor="end" opacity="0.82">wall-oss · 以下均摘自本文</text>
<rect x="24" y="68" width="852" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="48" cy="95" r="12" fill="#0891b2" opacity="0.14"/>
<text x="48" y="100" font-size="12" fill="#0891b2" font-weight="700" text-anchor="middle">1</text>
<text x="72" y="92" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">章节没有给 GPU 数、优化器、学习率、warmup、EMA 或冻结模块，也没有给可写成公式的损失或维度定义；下面的数值全部来自 LeRobot 示例命令或模型卡，不是</text>
<text x="72" y="110" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">论文训练配方。</text>
<rect x="24" y="132" width="852" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="48" cy="159" r="12" fill="#0891b2" opacity="0.14"/>
<text x="48" y="164" font-size="12" fill="#0891b2" font-weight="700" text-anchor="middle">2</text>
<text x="72" y="156" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">GPU 数 / 学习率 / warmup / EMA / 冻结模块 章节未给 —</text>
<rect x="24" y="196" width="852" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="48" cy="223" r="12" fill="#0891b2" opacity="0.14"/>
<text x="48" y="228" font-size="12" fill="#0891b2" font-weight="700" text-anchor="middle">3</text>
<text x="72" y="220" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">章节没有给 N_GPU、B_micro、N_accum 中任何一项，因此无法用 B_eff = N_GPU × B_micro × N_accum 反推有效 batch；batch_size=32 只是单条示例命令</text>
<text x="72" y="238" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">里的值，不能当成论文配方。</text>
<rect x="24" y="260" width="852" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="48" cy="287" r="12" fill="#0891b2" opacity="0.14"/>
<text x="48" y="292" font-size="12" fill="#0891b2" font-weight="700" text-anchor="middle">4</text>
<text x="72" y="284" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">完整训练：章节没有给预训练配方，不能声称可复现论文训练；章节本身也明确说“从头预训练不是普通教程项目”。</text>
<rect x="24" y="324" width="852" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
