<text x="48" y="356" font-size="12" fill="#0891b2" font-weight="700" text-anchor="middle">5</text>
<text x="72" y="348" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">章节没有给任何成功率、显存或延迟数字，本文不补写</text>
<text x="24" y="416" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">原文摘录；未补充原文没有的结论或风险判断</text>
