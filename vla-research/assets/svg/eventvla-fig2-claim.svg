<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">EventVLA 重新分配的是“历史信息存在哪里”这个接口——不是把历史压进模型隐状态，而是把少量原图关键帧存在 runtime 侧，等后续决策需要</text>
