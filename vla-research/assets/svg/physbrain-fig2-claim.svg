<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">PhysBrain 1.0 重新分配的是“物理常识”的训练位置——不把常识寄望于机器人轨迹里自然涌现，而是先用人类第一人称视频做一轮结构化物理监</text>
