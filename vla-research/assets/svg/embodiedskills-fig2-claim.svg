<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">每个技能决策都是提案：guarded runtime 先查前置条件再执行、执行后用新观测验证——六阶段 AgentLoop（Observe/Plan/Preflight/Execu</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">te/Verify/Recover），低层 π₀.₅ 出有界 chunk；RoboTwin 2.0 86.20%、LIBERO 97.40%；去掉验证掉到 48.2%</text>
