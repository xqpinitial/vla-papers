<text x="38" y="216" font-size="12" fill="#334155" font-weight="400" text-anchor="start">低层 VLA（OpenPI/π₀.₅，可插拔可任务适配）；高层 Qwen3-VL + 组件 LoRA；AgentLoop 接口固定</text>
