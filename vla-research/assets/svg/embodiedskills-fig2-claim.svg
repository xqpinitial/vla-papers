<text x="470" y="197" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">演化</text>
<text x="470" y="216" font-size="12" fill="#334155" font-weight="400" text-anchor="start">统一 trajectory schema 记录规划/执行/验证/恢复事件，供组件级 SFT 与可选在线适应</text>
