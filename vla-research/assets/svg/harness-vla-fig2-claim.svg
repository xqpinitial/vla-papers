<text x="40" y="92" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">一句话</text>
<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">把 Coding-Agent 的 Harness Layer 搬进具身智能：冻结 VLA 降格为库里一个可重试的接触原语 vla_act，配 6+2 个固定解析原语 + 双层记</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">忆，planner 学的是原语的 operating range——词汇锁死、VLA 零微调</text>
<rect x="24" y="176" width="420" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="38" y="197" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">冻结</text>
<text x="38" y="216" font-size="12" fill="#334155" font-weight="400" text-anchor="start">底座 VLA（π_RLinf，flow-matching）+ planner（LLM）</text>
<rect x="456" y="176" width="420" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="470" y="197" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">演化</text>
<text x="470" y="216" font-size="12" fill="#334155" font-weight="400" text-anchor="start">无参数更新；探索期把成功轨迹与规则蒸馏进两块记忆</text>
<rect x="24" y="252" width="420" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="38" y="273" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">头部结果</text>
<text x="38" y="292" font-size="12" fill="#334155" font-weight="400" text-anchor="start">LIBERO-Pro 82.4%（同冻结 π_RLinf 直滚 50.0%；RATS 43.8%；Cap-X 18.2%）</text>
<rect x="456" y="252" width="420" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="470" y="273" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start">关键纪律</text>
<text x="470" y="292" font-size="12" fill="#334155" font-weight="400" text-anchor="start">planner 永不直接输出力矩/关节目标/action chunk——整个动作空间坍缩为封闭可审计的 JSON 契约</text>
