<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">EventVLA：预测写入的原图关键帧记忆</text>

  <!-- inputs -->
  <rect x="24" y="76" width="180" height="64" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="114" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">当前观测 + 任务指令</text>
  <text x="114" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">多视角 RGB</text>

  <!-- vla -->
  <rect x="240" y="76" width="190" height="64" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="335" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">VLA Transformer</text>
  <text x="335" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">最后层 hidden states</text>

  <!-- kem -->
  <rect x="466" y="76" width="180" height="64" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="556" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">KEM head</text>
  <text x="556" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">未来 H 步关键帧概率</text>

  <!-- write control -->
  <rect x="692" y="76" width="184" height="84" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="784" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">在线写入控制</text>
  <text x="784" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">threshold / 1D NMS</text>
  <text x="784" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">cooldown / FIFO</text>

  <line x1="204" y1="108" x2="240" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="108" x2="466" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646" y1="108" x2="692" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- write path -->
  <path d="M 784 160 L 784 196 L 368 196 L 368 230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- memory bank -->
  <rect x="240" y="230" width="256" height="90" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="368" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Raw keyframe image bank</text>
  <text x="368" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">固定 anchors + 事件关键帧</text>
  <text x="368" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">去重 / 排序 / 最多 4 张</text>

  <line x1="496" y1="275" x2="560" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#475569">回灌</text>

  <!-- next forward -->
  <rect x="560" y="230" width="240" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="680" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">下一次 forward</text>
  <text x="680" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">memory_keyframe_images</text>
  <text x="680" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">→ 动作 chunk</text>

  <text x="24" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">记忆 M_t = 固定 visual anchors + 事件关键帧；KEM 预测未来写入点，不是事后回看。</text>
  <text x="24" y="384" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">章节配置：max_keyframes=4；anchors = first / t-30 / t-15 / current；action horizon=50。</text>
  <text x="24" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 EventVLA 导读；不是论文原图。</text>
</svg>
