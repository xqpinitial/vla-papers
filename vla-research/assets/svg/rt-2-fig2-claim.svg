<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">RT-2 用 55B 的 PaLI-X 或 PaLM-E，把机器人动作编码成文本字符串，并在机器人数据与互联网 VQA 数据上联合微调；推理频率低于 1Hz。它的</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">价值是证明互联网视觉语言知识可以迁移到机器人控制，代价是模型规模与推理速度。本地章节没有给出 RT-2 的代码、权重、成功率或训练配方，</text>
<text x="40" y="166" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">因</text>
