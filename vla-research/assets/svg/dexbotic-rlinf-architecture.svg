<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Dexbotic-RLinf：模型入口与分布式 RL 后端</text>
  <text x="28" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Dexbotic 管模型、数据与实验配置；RLinf 管 cluster、rollout、actor 与 checkpoint</text>

  <!-- dexbotic cli -->
  <rect x="24" y="86" width="190" height="72" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="119" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Dexbotic CLI</text>
  <text x="119" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">model_rl_libero_pi0</text>
  <text x="119" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">+ Hydra RL config</text>

  <!-- registry -->
  <rect x="244" y="86" width="180" height="72" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="334" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Registry bridge</text>
  <text x="334" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">dexbotic_pi0 / dm0</text>
  <text x="334" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">RLINF_EXT_MODULE</text>

  <!-- cluster -->
  <rect x="244" y="200" width="180" height="72" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="334" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">RLinf cluster</text>
  <text x="334" y="247" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">placement strategy</text>
  <text x="334" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">EmbodiedRunner</text>

  <!-- actor -->
  <rect x="474" y="86" width="180" height="72" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="564" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Actor worker</text>
  <text x="564" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">FSDP PPO update</text>
  <text x="564" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">checkpoint / logs</text>

  <!-- rollout -->
  <rect x="474" y="200" width="180" height="72" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="564" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Rollout worker</text>
  <text x="564" y="247" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">policy inference</text>
  <text x="564" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">π0 chunk 5 / DM0 chunk 10</text>

  <!-- env -->
  <rect x="474" y="314" width="200" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="574" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">Env worker</text>
  <text x="574" y="361" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">LIBERO / maniskill_libero</text>
  <text x="574" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">success reward</text>

  <!-- arrows -->
  <line x1="214" y1="122" x2="240" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="334" y1="158" x2="334" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="342" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">校验配置</text>

  <line x1="424" y1="212" x2="470" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="424" y1="236" x2="470" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="424" y1="258" x2="470" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="564" y1="272" x2="564" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">动作</text>

  <path d="M 674 350 L 710 350 L 710 122 L 658 122" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="682" y="378" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">trajectories+reward</text>

  <text x="700" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">输出：checkpoint</text>
  <text x="700" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">+ env/success_once</text>

  <text x="24" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">两种入口共享同一套 RLinf worker 与 PPO 语义；区别在启动路径与用户体验。</text>
  <text x="24" y="421" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地导读；不是论文原图。</text>
</svg>
