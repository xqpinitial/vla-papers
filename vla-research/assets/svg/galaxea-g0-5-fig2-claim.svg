<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">G0.5 重新分配的是“推理、动作表征、跨本体控制”三者的接口——不再让外部 planner 写推理、另一个 action head 出动作，而是让同一个 t</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">ransformer decoder 在一条 next-token 序列里写完 CoT 再写动作 token。【章节】</text>
