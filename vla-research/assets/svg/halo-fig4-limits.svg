<text x="64" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#085041" text-anchor="start">本文判断：仿真可以作为人形自主的数据引擎——把人类操作员移出数据回路后，整栈零样本迁移到训练与扫描都未出现的真实环境；但任务设计仍依</text>
<text x="64" y="182" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#085041" text-anchor="start">赖人写 prompt 与关键帧，且感知以视觉为主、缺少接触觉。</text>
