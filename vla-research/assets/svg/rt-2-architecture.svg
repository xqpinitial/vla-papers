<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="30" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">RT-2：训练与推理信息流</text>

  <!-- inference row -->
  <rect x="30" y="80" width="170" height="62" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="115" y="105" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">机器人图像</text>
  <text x="115" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">+ 语言指令</text>
  <line x1="200" y1="111" x2="248" y2="111" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="72" width="220" height="80" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="360" y="103" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2937">PaLI-X / PaLM-E</text>
  <text x="360" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">55B VLM</text>
  <line x1="470" y1="112" x2="518" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="72" width="200" height="80" rx="8" fill="#fff7e6" stroke="#b7791f"/>
  <text x="620" y="103" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">文本动作 token</text>
  <text x="620" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937">「128 128 100 ...」</text>
  <line x1="720" y1="112" x2="768" y2="112" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="770" y="82" width="120" height="60" rx="8" fill="#eef4ff" stroke="#3b6fb6"/>
  <text x="830" y="107" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">机器人</text>
  <text x="830" y="128" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">执行</text>

  <!-- training row -->
  <rect x="30" y="230" width="170" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="115" y="255" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">互联网 VQA</text>
  <text x="115" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">数据</text>

  <rect x="230" y="230" width="170" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="315" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">机器人轨迹</text>

  <line x1="200" y1="261" x2="228" y2="261" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="261" x2="448" y2="261" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="230" width="170" height="62" rx="8" fill="#e8f7ee" stroke="#2f855a"/>
  <text x="535" y="266" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2937">联合微调</text>
  <line x1="535" y1="230" x2="535" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">训练：机器人轨迹 + 互联网 VQA 联合微调；推理：动作以文本 token 自回归生成。</text>
  <text x="30" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">关键数字：55B 参数；推理低于 1Hz；动作 = 文本 token。RT-1 对照：35M、256 bins、约 3Hz。</text>
  <text x="30" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">图为自绘信息流，依据本地 RT 系列导读；不是论文原图。</text>
</svg>
