<text x="40" y="1038" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#5F6B7A" text-anchor="start">口径冲突已显式分列：本地笔记（LeRobot 实现）为 3×256×256 / 64 token / 66 token / 10×7 / 51.55M 参数；本图为论文原文口径 480×640 / 1200×512 / k×14。</text>
<text x="40" y="1058" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#5F6B7A" text-anchor="start">两套数字来自不同实现，不可互相换算或拼接；推广到 44 篇时会逐篇记录「论文口径 / 实现口径 / 原文未给」三种状态。</text>
<text x="40" y="1078" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#5F6B7A" text-anchor="start">论文未给 512 维 transformer 的层数、注意力头数与 FFN 宽度（这些数字来自本地 LeRobot 代码导读）。</text>
<text x="40" y="1102" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#8A94A3" text-anchor="start">维度均标注出处；查不到的一律标「原文未给」，不臆造、不跨实现混用</text>
