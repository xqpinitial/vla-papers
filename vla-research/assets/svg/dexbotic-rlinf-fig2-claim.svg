<text x="40" y="116" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">Dexbotic-RLinf 重新分配的是“模型开发”和“RL 训练系统”的边界——Dexbotic 继续做 VLA 用户入口，RLinf 做后端，两者通过 model re</text>
<text x="40" y="141" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">gistry 和薄 adapter 连接，而不是把模型代码复制进 RL 仓库，或让模型仓库重写一套 RL 系统。【章节】</text>
